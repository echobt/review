name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: review, POSTGRES_PASSWORD: review, POSTGRES_DB: review }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
        env:
          # Runs the per-table RLS isolation suite against real Postgres 16 in addition to PGlite.
          RLS_DATABASE_URL: postgres://review:review@localhost:5432/review
