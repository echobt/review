# Local dev stack only. No secrets: credentials below are throwaway local defaults.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review"]
      interval: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: review
      MINIO_ROOT_PASSWORD: review-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
volumes:
  pgdata: {}
  miniodata: {}
